# Spring Boot application properties
spring.application.name=sociography

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/sociography
#?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=12345
	
# Hibernate JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Enable Spring Boot DevTools
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# Logging Configuration
logging.level.org.springframework=INFO
logging.level.com.example.sociography=DEBUG

# Server Configuration
server.port=8080

#File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=2MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Configuration
# Override in production via the JWT_SECRET environment variable.
jwt.secret=${JWT_SECRET:G3LhYyHJ+YAYKfMhK+XO+do2hMVD2fRccLzJgn4/B1eVJEp/9eV+dpR2OkNUct5Yk3X3om1ZONvSdmhO+BBeHg==}

# CORS Configuration
# Comma-separated list of allowed frontend origins. Override in production
# via the CORS_ALLOWED_ORIGINS environment variable.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

