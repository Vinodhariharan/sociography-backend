# Spring Boot application properties
spring.application.name=sociography

# PostgreSQL Database Configuration
# Override in production via the DB_URL / DB_USERNAME / DB_PASSWORD environment variables
# (e.g. Supabase connection details).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sociography}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Hibernate JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Enable Spring Boot DevTools
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# Logging Configuration
logging.level.org.springframework=INFO
logging.level.com.example.sociography=DEBUG

# Server Configuration
# Render (and most PaaS hosts) inject PORT at runtime and require the app to
# bind to it; 8080 remains the default for local dev.
server.port=${PORT:8080}

#File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=2MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Configuration
# Override in production via the JWT_SECRET environment variable.
jwt.secret=${JWT_SECRET:G3LhYyHJ+YAYKfMhK+XO+do2hMVD2fRccLzJgn4/B1eVJEp/9eV+dpR2OkNUct5Yk3X3om1ZONvSdmhO+BBeHg==}

# CORS Configuration
# Comma-separated list of allowed frontend origins. Override in production
# via the CORS_ALLOWED_ORIGINS environment variable.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

